[pytest]
testpaths =
    swarajya-login/hr_admin/tests
    swarajya-login/emp-manager/tests
    swarajya-create/employee-management/tests
    swarajya-create/vendor-management/tests
    swarajya-create/customer-management/tests
    swarajya-create/invoice-management/tests
    swarajya-update/purchase-orders/tests
    swarajya-update/customer-management/tests
    swarajya-update/employee-management/tests
    swarajya-update/invoice-management/tests
python_files = test_*.py *_flows.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --import-mode=importlib
markers =
    smoke: Critical smoke tests
    regression: Full regression suite
    positive: Positive / happy-path tests
    negative: Negative / error-handling tests
    blocked: Blocked tests
    security: Security tests
    tfa: Two-factor authentication tests
    login: Authentication tests
    tc_id: Test case ID reference
    role: Role under test
    invoice: Invoice management tests
    invoice_update: Invoice update management tests
    customer: Customer management tests
    customer_update: Customer update management tests
    vendor: Vendor management tests
    employee: Employee management tests
    emp_update: Employee update management tests
    employee_update: Employee update management tests
    purchase_order: Purchase order tests
    po_update: Purchase order update tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
