[pytest]
testpaths =
    swarajya-create/employee-management/tests
    swarajya-create/vendor-management/tests
    swarajya-create/consultant-management/tests
    swarajya-login/swarajya-automation/tests
    update/emp_mgmt/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Core login tests (minimal set for quick validation)
    regression: Full regression suite
    positive: Positive / happy-path tests
    negative: Negative / error-handling tests
    blocked: Tests that cannot run due to missing app functionality or credentials
    security: Security-related tests (injection, session, access control)
    tfa: Two-factor authentication tests
    login: Authentication tests
    employee: Employee management tests
    vendor: Vendor management tests
    consultant: Consultant management tests
    tc_id: Test case ID reference
    role: Role marker
    sanity: Quick smoke and environment verification
    slow: Tests that take longer to run

addopts = -v --tb=short --import-mode=importlib
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
