[pytest]
testpaths = swarajya-login/emp-manager/tests
python_files = test_*.py *_flows.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    smoke: Critical smoke tests
    regression: Full regression suite
    positive: Positive / happy-path tests
    negative: Negative / error-handling tests
    blocked: Blocked tests
    security: Security tests
    tfa: Two-factor authentication tests
    login: Authentication tests
    tc_id: Test case ID reference
    role: Role under test
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
