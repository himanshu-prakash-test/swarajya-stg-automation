[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    -ra
    --strict-markers
    --tb=short

markers =
    api: API automated tests
    positive: Positive functional flow tests
    negative: Negative, validation, and security tests
    smoke: Smoke test subset for quick sanity
    data_driven: Dynamic Excel row parameterized tests
    tc_id: Test Case ID identifier for bi-directional Excel reporting

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

