

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v --tb=short

markers =
    tc_id(id): Excel test case ID reference
    positive: Positive employee creation test cases
    negative: Negative employee validation test cases
    login: Authentication test cases
    employee: Employee management test cases
    smoke: Core sanity smoke tests
    regression: Full regression test suite
    security: Security and authorization tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
