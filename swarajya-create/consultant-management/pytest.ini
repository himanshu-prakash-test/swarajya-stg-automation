[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v --tb=short

markers =
    tc_id(id): Excel test case ID reference
    positive: Positive consultant creation test cases
    negative: Negative consultant validation test cases
    login: Authentication test cases
    consultant: Consultant management test cases
    smoke: Core sanity smoke tests
    regression: Full regression test suite

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
