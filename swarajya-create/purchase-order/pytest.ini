[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --tb=short --import-mode=importlib
markers =
    login: Authentication and session verification tests
    positive: Positive workflow scenarios from master Excel
    negative: Negative input validation tests from master Excel
    purchase_order: Purchase Order module test cases
    tc_id: Test Case identifier marker
