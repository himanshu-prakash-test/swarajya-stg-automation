[pytest]
testpaths = employee-management/tests purchase-orders/tests customer-management/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v --tb=short --import-mode=importlib

markers =
    tc_id(id): Excel test case ID reference
    positive: Positive update test cases
    negative: Negative validation test cases
    smoke: Core sanity smoke tests
    sanity: Quick sanity smoke tests
    regression: Full regression test suite
    login: Login and authentication verification tests
    security: Security and authorization tests
    employee: Employee management test cases
    emp_update: Employee update test cases
    purchase_order: Purchase Order test cases
    po_update: Purchase Order update test cases
    customer: Customer management test cases
    customer_update: Customer update test cases

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
