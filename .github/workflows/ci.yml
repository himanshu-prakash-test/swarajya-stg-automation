name: Swarajya Automation CI/CD Pipeline

'on':
  push:
    branches:
      - main
      - shared
      - 'login/**'
      - 'create/**'
      - 'update/**'
      - 'read/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      browser_mode:
        description: 'Browser execution mode (headless or headed)'
        required: false
        default: 'headless'
        type: choice
        options:
          - headless
          - headed
      run_whole_code:
        description: 'Run all test suites across the whole codebase (all modules)'
        required: false
        default: false
        type: boolean
      module_path:
        description: 'Target test directory or path (leave blank to use branch default)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Automated Tests (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CI: "true"
      HEADLESS: "1"
      PYTEST_NO_POPUP: "1"
      SWARAJYA_ENV: "staging"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          playwright install --with-deps chromium

      - name: Verify Pytest Test Collection
        run: |
          pytest --collect-only -q

      - name: Execute Pytest Suite
        continue-on-error: true
        run: |
          mkdir -p reports
          
          BROWSER_MODE="${{ github.event.inputs.browser_mode || 'headless' }}"
          RUN_WHOLE_CODE="${{ github.event.inputs.run_whole_code || 'false' }}"
          TARGET_PATH="${{ github.event.inputs.module_path }}"

          echo "=========================================="
          echo "Browser Mode   : $BROWSER_MODE"
          echo "Run Whole Code : $RUN_WHOLE_CODE"
          echo "Target Path    : $TARGET_PATH"
          echo "Branch / Ref   : ${{ github.ref_name }}"
          echo "=========================================="

          if [ "$BROWSER_MODE" = "headed" ]; then
            echo "Configuring Headed mode using Xvfb virtual display..."
            export HEADLESS="0"
            export CI=""
            export GITHUB_ACTIONS=""
          else
            echo "Configuring Headless mode..."
            export HEADLESS="1"
            export CI="true"
          fi

          run_test() {
            TEST_DIR="$1"
            REPORT_NAME="$2"
            echo ">>> Running test suite: $TEST_DIR"
            if [ "$BROWSER_MODE" = "headed" ]; then
              xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pytest "$TEST_DIR" --headed -v --html="reports/$REPORT_NAME" --self-contained-html || true
            else
              pytest "$TEST_DIR" --headless -v --html="reports/$REPORT_NAME" --self-contained-html || true
            fi
          }

          run_all_modules() {
            echo ">>> Executing all modules across the entire codebase..."
            run_test "swarajya-login/hr_admin/tests" "login_hr_admin_report.html"
            run_test "swarajya-login/emp-manager/tests" "login_report.html"
            run_test "swarajya-create/employee-management/tests" "create_emp_report.html"
            run_test "swarajya-create/vendor-management/tests" "create_vendor_report.html"
            run_test "swarajya-create/customer-management/tests" "create_customer_report.html"
            run_test "swarajya-create/invoice-management/tests" "create_invoice_report.html"
            run_test "swarajya-create/purchase-order/tests" "create_po_report.html"
            run_test "swarajya-create/consultant-management/tests" "create_consultant_report.html"
            run_test "swarajya-update/purchase-orders/tests" "update_po_report.html"
            run_test "swarajya-update/customer-management/tests" "update_customer_report.html"
            run_test "swarajya-update/employee-management/tests" "update_emp_report.html"
            run_test "swarajya-update/invoice-management/tests" "update_invoice_report.html"
            run_test "swarajya-read/invoice-report/tests" "read_invoice_report.html"
          }

          if [ -n "$TARGET_PATH" ]; then
            echo "Executing manually specified path: $TARGET_PATH"
            run_test "$TARGET_PATH" "custom_report.html"
          elif [ "$RUN_WHOLE_CODE" = "true" ]; then
            run_all_modules
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "Determining changed modules on main..."
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            echo "Changed files in latest commit:"
            echo "$CHANGED_FILES"
            
            RAN_ANY=0
            check_and_run() {
              MODULE_PATTERN="$1"
              TEST_DIR="$2"
              REPORT="$3"
              if [ -d "$TEST_DIR" ]; then
                CODE_CHANGED=$(echo "$CHANGED_FILES" | grep "^$MODULE_PATTERN" | grep -v "README.md" | grep -v "__init__.py" || true)
                if [ -n "$CODE_CHANGED" ]; then
                  echo "Found code changes in $MODULE_PATTERN:"
                  echo "$CODE_CHANGED"
                  run_test "$TEST_DIR" "$REPORT"
                  RAN_ANY=1
                fi
              fi
            }

            check_and_run "swarajya-login/hr_admin" "swarajya-login/hr_admin/tests" "login_hr_admin_report.html"
            check_and_run "swarajya-login/emp-manager" "swarajya-login/emp-manager/tests" "login_report.html"
            check_and_run "swarajya-create/employee-management" "swarajya-create/employee-management/tests" "create_emp_report.html"
            check_and_run "swarajya-create/vendor-management" "swarajya-create/vendor-management/tests" "create_vendor_report.html"
            check_and_run "swarajya-create/customer-management" "swarajya-create/customer-management/tests" "create_customer_report.html"
            check_and_run "swarajya-create/invoice-management" "swarajya-create/invoice-management/tests" "create_invoice_report.html"
            check_and_run "swarajya-create/purchase-order" "swarajya-create/purchase-order/tests" "create_po_report.html"
            check_and_run "swarajya-create/consultant-management" "swarajya-create/consultant-management/tests" "create_consultant_report.html"
            check_and_run "swarajya-update/purchase-orders" "swarajya-update/purchase-orders/tests" "update_po_report.html"
            check_and_run "swarajya-update/customer-management" "swarajya-update/customer-management/tests" "update_customer_report.html"
            check_and_run "swarajya-update/employee-management" "swarajya-update/employee-management/tests" "update_emp_report.html"
            check_and_run "swarajya-update/invoice-management" "swarajya-update/invoice-management/tests" "update_invoice_report.html"
            check_and_run "swarajya-read/invoice-report" "swarajya-read/invoice-report/tests" "read_invoice_report.html"

            if [ "$RAN_ANY" -eq 0 ]; then
              echo "No module-specific files changed. Running core verification suite..."
              run_test "swarajya-update/employee-management/tests" "latest_report.html"
            fi
          else
            echo "Executing default test suite configured for branch ${{ github.ref_name }}..."
            if { [ "${{ github.ref_name }}" = "create/vendor-mgmt" ] || [ "${{ github.ref_name }}" = "create/vendor_mgmt" ]; } && [ -d "swarajya-create/vendor-management/tests" ]; then
              run_test "swarajya-create/vendor-management/tests" "create_vendor_report.html"
            elif { [ "${{ github.ref_name }}" = "create/consultant_mgmt" ] || [ "${{ github.ref_name }}" = "create/consultant-mgmt" ]; } && [ -d "swarajya-create/consultant-management/tests" ]; then
              run_test "swarajya-create/consultant-management/tests" "create_consultant_report.html"
            elif { [ "${{ github.ref_name }}" = "create/purchase_order" ] || [ "${{ github.ref_name }}" = "create/purchase-order" ]; } && [ -d "swarajya-create/purchase-order/tests" ]; then
              run_test "swarajya-create/purchase-order/tests" "create_po_report.html"
            elif { [ "${{ github.ref_name }}" = "create/customer-mgmt" ] || [ "${{ github.ref_name }}" = "create/customer_mgmt" ]; } && [ -d "swarajya-create/customer-management/tests" ]; then
              run_test "swarajya-create/customer-management/tests" "create_customer_report.html"
            elif { [ "${{ github.ref_name }}" = "create/invoice-mgmt" ] || [ "${{ github.ref_name }}" = "create/invoice_mgmt" ]; } && [ -d "swarajya-create/invoice-management/tests" ]; then
              run_test "swarajya-create/invoice-management/tests" "create_invoice_report.html"
            elif { [ "${{ github.ref_name }}" = "create/emp-mgmt" ] || [ "${{ github.ref_name }}" = "create/emp_mgmt" ] || [ "${{ github.ref_name }}" = "create/employee-management" ]; } && [ -d "swarajya-create/employee-management/tests" ]; then
              run_test "swarajya-create/employee-management/tests" "create_emp_report.html"
            elif [ "${{ github.ref_name }}" = "login/emp-manager" ] && [ -d "swarajya-login/emp-manager/tests" ]; then
              run_test "swarajya-login/emp-manager/tests" "login_report.html"
            elif [ "${{ github.ref_name }}" = "login/hr_admin" ] && [ -d "swarajya-login/hr_admin/tests" ]; then
              run_test "swarajya-login/hr_admin/tests" "login_hr_admin_report.html"
            elif { [ "${{ github.ref_name }}" = "read/invoice-report" ] || [ "${{ github.ref_name }}" = "read/invoice_report" ] || [ "${{ github.ref_name }}" = "read/invoice-reports" ]; } && [ -d "swarajya-read/invoice-report/tests" ]; then
              run_test "swarajya-read/invoice-report/tests" "read_invoice_report.html"
            elif [ "${{ github.ref_name }}" = "update/invoice_mgmt" ] && [ -d "swarajya-update/invoice-management/tests" ]; then
              run_test "swarajya-update/invoice-management/tests" "update_invoice_report.html"
            elif { [ "${{ github.ref_name }}" = "update/emp_mgmt" ] || [ "${{ github.ref_name }}" = "update/emp-mgmt" ]; } && [ -d "swarajya-update/employee-management/tests" ]; then
              run_test "swarajya-update/employee-management/tests" "update_emp_report.html"
            elif { [ "${{ github.ref_name }}" = "update/customer_mgmt" ] || [ "${{ github.ref_name }}" = "update/customer-management" ]; } && [ -d "swarajya-update/customer-management/tests" ]; then
              run_test "swarajya-update/customer-management/tests" "update_customer_report.html"
            elif { [ "${{ github.ref_name }}" = "update/purchase-orders" ] || [ "${{ github.ref_name }}" = "update/purchase-order" ] || [ "${{ github.ref_name }}" = "update/purchase_order" ]; } && [ -d "swarajya-update/purchase-orders/tests" ]; then
              run_test "swarajya-update/purchase-orders/tests" "update_po_report.html"
            elif [ "${{ github.ref_name }}" = "shared" ] && [ -d "swarajya-update/employee-management/tests" ]; then
              echo ">>> Running Shared Framework Verification Tests..."
              run_test "swarajya-update/employee-management/tests" "shared_verification_report.html"
            elif [ -d "swarajya-update/employee-management/tests" ]; then
              run_test "swarajya-update/employee-management/tests" "latest_report.html"
            else
              run_test "swarajya-update/customer-management/tests" "latest_report.html"
            fi
          fi

      - name: Prepare Artifact Metadata
        if: always()
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "ARTIFACT_NAME=swarajya-test-artifacts-${SAFE_BRANCH}" >> "$GITHUB_ENV"

      - name: Upload HTML Test Report & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            reports/
            screenshots/
            shared/reports/
            **/screenshots/
          retention-days: 14
