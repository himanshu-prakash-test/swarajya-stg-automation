name: Swarajya Automation CI/CD Pipeline

on:
  push:
    branches:
      - main
      - shared
      - 'login/**'
      - 'create/**'
      - 'update/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      module_path:
        description: 'Target test directory or path (leave blank to use branch default)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Automated Tests (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: "true"
      HEADLESS: "1"
      PYTEST_NO_POPUP: "1"
      SWARAJYA_ENV: "staging"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Verify Pytest Test Collection
        run: |
          pytest --collect-only -q

      - name: Execute Pytest Suite
        continue-on-error: true
        run: |
          mkdir -p reports
          TARGET_PATH="${{ github.event.inputs.module_path }}"
          if [ -n "$TARGET_PATH" ]; then
            echo "Executing manually specified path: $TARGET_PATH"
            pytest "$TARGET_PATH" -v --html=reports/latest_report.html --self-contained-html || true
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "Executing all module suites independently..."
            EXIT_CODE=0
            if [ -d "swarajya-login/hr_admin/tests" ]; then
              echo ">>> Running Login HR-Admin Tests..."
              pytest swarajya-login/hr_admin/tests -v --html=reports/login_hr_admin_report.html --self-contained-html || EXIT_CODE=1
            fi
            if [ -d "swarajya-login/emp-manager/tests" ]; then
              echo ">>> Running Login Emp-Manager Tests..."
              pytest swarajya-login/emp-manager/tests -v --html=reports/login_report.html --self-contained-html || EXIT_CODE=1
            fi
            if [ -d "swarajya-create/employee-management/tests" ]; then
              echo ">>> Running Create Employee-Management Tests..."
              pytest swarajya-create/employee-management/tests -v --html=reports/create_emp_report.html --self-contained-html || EXIT_CODE=1
            fi
            if [ -d "swarajya-create/vendor-management/tests" ]; then
              echo ">>> Running Create Vendor-Management Tests..."
              pytest swarajya-create/vendor-management/tests -v --html=reports/create_vendor_report.html --self-contained-html || EXIT_CODE=1
            fi
            if [ -d "swarajya-create/customer-management/tests" ]; then
              echo ">>> Running Create Customer-Management Tests..."
              pytest swarajya-create/customer-management/tests -v --html=reports/create_customer_report.html --self-contained-html || EXIT_CODE=1
            fi
            if [ -d "swarajya-create/invoice-management/tests" ]; then
              echo ">>> Running Create Invoice-Management Tests..."
              pytest swarajya-create/invoice-management/tests -v --html=reports/create_invoice_report.html --self-contained-html || EXIT_CODE=1
            fi
            if [ -d "swarajya-create/purchase-order/tests" ]; then
              echo ">>> Running Create Purchase-Order Tests..."
              pytest swarajya-create/purchase-order/tests -v --html=reports/create_po_report.html --self-contained-html || EXIT_CODE=1
            fi
            if [ -d "swarajya-update/purchase-orders/tests" ]; then
              echo ">>> Running Update Purchase-Orders Tests..."
              pytest swarajya-update/purchase-orders/tests -v --html=reports/update_po_report.html --self-contained-html || EXIT_CODE=1
            fi
            if [ -d "swarajya-update/customer-management/tests" ]; then
              echo ">>> Running Update Customer-Management Tests..."
              pytest swarajya-update/customer-management/tests -v --html=reports/update_customer_report.html --self-contained-html || EXIT_CODE=1
            fi
            if [ -d "swarajya-update/employee-management/tests" ]; then
              echo ">>> Running Update Employee-Management Tests..."
              pytest swarajya-update/employee-management/tests -v --html=reports/update_emp_report.html --self-contained-html || EXIT_CODE=1
            fi
            if [ -d "swarajya-update/invoice-management/tests" ]; then
              echo ">>> Running Update Invoice-Management Tests..."
              pytest swarajya-update/invoice-management/tests -v --html=reports/update_invoice_report.html --self-contained-html || EXIT_CODE=1
            fi
            exit 0
          else
            echo "Executing default test suite configured for this branch..."
            if [ "${{ github.ref_name }}" = "create/purchase_order" ] && [ -d "swarajya-create/purchase-order/tests" ]; then
              pytest swarajya-create/purchase-order/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif [ "${{ github.ref_name }}" = "login/hr_admin" ] && [ -d "swarajya-login/hr_admin/tests" ]; then
              pytest swarajya-login/hr_admin/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif [ "${{ github.ref_name }}" = "update/invoice_mgmt" ] && [ -d "swarajya-update/invoice-management/tests" ]; then
              pytest swarajya-update/invoice-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif [ "${{ github.ref_name }}" = "update/emp_mgmt" ] && [ -d "swarajya-update/employee-management/tests" ]; then
              pytest swarajya-update/employee-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif [ "${{ github.ref_name }}" = "update/customer_mgmt" ] && [ -d "swarajya-update/customer-management/tests" ]; then
              pytest swarajya-update/customer-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif [ -d "swarajya-update/employee-management/tests" ]; then
              pytest swarajya-update/employee-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            else
              pytest swarajya-update/customer-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            fi
          fi

      - name: Prepare Artifact Metadata
        if: always()
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "ARTIFACT_NAME=swarajya-test-artifacts-${SAFE_BRANCH}" >> "$GITHUB_ENV"

      - name: Upload HTML Test Report & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            reports/
            screenshots/
            shared/reports/
            **/screenshots/
          retention-days: 14
