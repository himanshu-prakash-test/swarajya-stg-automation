name: Swarajya Automation CI/CD Pipeline

on:
  push:
    branches:
      - main
      - shared
      - 'login/**'
      - 'create/**'
      - 'update/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      module_path:
        description: 'Target test directory or path (leave blank to use branch default)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Automated Tests (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CI: "true"
      HEADLESS: "1"
      PYTEST_NO_POPUP: "1"
      SWARAJYA_ENV: "staging"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Verify Pytest Test Collection
        run: |
          pytest --collect-only -q

      - name: Execute Pytest Suite
        continue-on-error: true
        run: |
          mkdir -p reports
          TARGET_PATH="${{ github.event.inputs.module_path }}"
          if [ -n "$TARGET_PATH" ]; then
            echo "Executing manually specified path: $TARGET_PATH"
            pytest "$TARGET_PATH" -v --html=reports/latest_report.html --self-contained-html || true
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "Determining changed modules on main..."
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            echo "Changed files in latest commit:"
            echo "$CHANGED_FILES"
            
            RAN_ANY=0
            run_module() {
              MODULE_PATTERN="$1"
              TEST_DIR="$2"
              REPORT="$3"
              if [ -d "$TEST_DIR" ]; then
                if echo "$CHANGED_FILES" | grep -q "$MODULE_PATTERN"; then
                  echo ">>> Running $MODULE_PATTERN Tests..."
                  pytest "$TEST_DIR" -v --html="reports/$REPORT" --self-contained-html || true
                  RAN_ANY=1
                fi
              fi
            }

            run_module "swarajya-login/hr_admin" "swarajya-login/hr_admin/tests" "login_hr_admin_report.html"
            run_module "swarajya-login/emp-manager" "swarajya-login/emp-manager/tests" "login_report.html"
            run_module "swarajya-create/employee-management" "swarajya-create/employee-management/tests" "create_emp_report.html"
            run_module "swarajya-create/vendor-management" "swarajya-create/vendor-management/tests" "create_vendor_report.html"
            run_module "swarajya-create/customer-management" "swarajya-create/customer-management/tests" "create_customer_report.html"
            run_module "swarajya-create/invoice-management" "swarajya-create/invoice-management/tests" "create_invoice_report.html"
            run_module "swarajya-create/purchase-order" "swarajya-create/purchase-order/tests" "create_po_report.html"
            run_module "swarajya-create/consultant-management" "swarajya-create/consultant-management/tests" "create_consultant_report.html"
            run_module "swarajya-update/purchase-orders" "swarajya-update/purchase-orders/tests" "update_po_report.html"
            run_module "swarajya-update/customer-management" "swarajya-update/customer-management/tests" "update_customer_report.html"
            run_module "swarajya-update/employee-management" "swarajya-update/employee-management/tests" "update_emp_report.html"
            run_module "swarajya-update/invoice-management" "swarajya-update/invoice-management/tests" "update_invoice_report.html"

            if [ "$RAN_ANY" -eq 0 ]; then
              echo "No module-specific files changed. Running core verification suite..."
              pytest swarajya-update/employee-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            fi
            exit 0
          else
            echo "Executing default test suite configured for this branch..."
            if { [ "${{ github.ref_name }}" = "create/vendor-mgmt" ] || [ "${{ github.ref_name }}" = "create/vendor_mgmt" ]; } && [ -d "swarajya-create/vendor-management/tests" ]; then
              pytest swarajya-create/vendor-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif { [ "${{ github.ref_name }}" = "create/consultant_mgmt" ] || [ "${{ github.ref_name }}" = "create/consultant-mgmt" ]; } && [ -d "swarajya-create/consultant-management/tests" ]; then
              pytest swarajya-create/consultant-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif { [ "${{ github.ref_name }}" = "create/purchase_order" ] || [ "${{ github.ref_name }}" = "create/purchase-order" ]; } && [ -d "swarajya-create/purchase-order/tests" ]; then
              pytest swarajya-create/purchase-order/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif { [ "${{ github.ref_name }}" = "create/customer-mgmt" ] || [ "${{ github.ref_name }}" = "create/customer_mgmt" ]; } && [ -d "swarajya-create/customer-management/tests" ]; then
              pytest swarajya-create/customer-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif { [ "${{ github.ref_name }}" = "create/invoice-mgmt" ] || [ "${{ github.ref_name }}" = "create/invoice_mgmt" ]; } && [ -d "swarajya-create/invoice-management/tests" ]; then
              pytest swarajya-create/invoice-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif { [ "${{ github.ref_name }}" = "create/emp-mgmt" ] || [ "${{ github.ref_name }}" = "create/emp_mgmt" ]; } && [ -d "swarajya-create/employee-management/tests" ]; then
              pytest swarajya-create/employee-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif [ "${{ github.ref_name }}" = "login/emp-manager" ] && [ -d "swarajya-login/emp-manager/tests" ]; then
              pytest swarajya-login/emp-manager/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif [ "${{ github.ref_name }}" = "login/hr_admin" ] && [ -d "swarajya-login/hr_admin/tests" ]; then
              pytest swarajya-login/hr_admin/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif [ "${{ github.ref_name }}" = "update/invoice_mgmt" ] && [ -d "swarajya-update/invoice-management/tests" ]; then
              pytest swarajya-update/invoice-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif { [ "${{ github.ref_name }}" = "update/emp_mgmt" ] || [ "${{ github.ref_name }}" = "update/emp-mgmt" ]; } && [ -d "swarajya-update/employee-management/tests" ]; then
              pytest swarajya-update/employee-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif [ "${{ github.ref_name }}" = "update/customer_mgmt" ] && [ -d "swarajya-update/customer-management/tests" ]; then
              pytest swarajya-update/customer-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif { [ "${{ github.ref_name }}" = "update/purchase-order" ] || [ "${{ github.ref_name }}" = "update/purchase_order" ]; } && [ -d "swarajya-update/purchase-orders/tests" ]; then
              pytest swarajya-update/purchase-orders/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif [ "${{ github.ref_name }}" = "shared" ] && [ -d "swarajya-update/employee-management/tests" ]; then
              echo ">>> Running Shared Framework Verification Tests..."
              pytest swarajya-update/employee-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            elif [ -d "swarajya-update/employee-management/tests" ]; then
              pytest swarajya-update/employee-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            else
              pytest swarajya-update/customer-management/tests -v --html=reports/latest_report.html --self-contained-html || true
            fi
          fi

      - name: Prepare Artifact Metadata
        if: always()
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "ARTIFACT_NAME=swarajya-test-artifacts-${SAFE_BRANCH}" >> "$GITHUB_ENV"

      - name: Upload HTML Test Report & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            reports/
            screenshots/
            shared/reports/
            **/screenshots/
          retention-days: 14
